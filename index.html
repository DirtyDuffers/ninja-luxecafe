        <Acc sid="method" icon="📋" label="How to make it">
          {d.machine.map(function(step,i){return(
            <div key={i} style={{display:"flex",gap:12,marginBottom:12,alignItems:"flex-start"}}>
              <div style={{width:24,height:24,borderRadius:12,background:t.acc,color:"#FFF",

              <div style={{fontSize:13,color:t.txt,lineHeight:1.6,flex:1}}>{step}</div>

                <div style={{fontSize:12,color:t.sub}}>{fp.desc}</div>
              </div>

            <div>
              <textarea value={noteDraft} onChange={function(e){setNoteDraft(e.target.value);}}

                  style={{background:t.btn,color:t.sub,border:"1px solid "+t.btnBor,borderRadius:8,padding:"8px 14px",fontSize:13}}>

                style={{background:t.btn,color:t.sub,border:"1px solid "+t.btnBor,borderRadius:8,padding:"7px 14px",fontSize:12}}>

        {/* Rating */}
        <div style={{background:t.card,border:"1px solid "+t.cardBor,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
          <div style={{fontSize:10,color:t.lbl,textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:10}}>⭐ How did it go?</div>
          <div style={{display:"flex",gap:8}}>
            {[["👍","Great"],["⭐","Amazing"],["👎","Needs work"]].map(function(opt){
              var active = rated===opt[0];
              return(
                <button key={opt[0]} onClick={function(){saveRating(d.id, opt[0]);}}
                  style={{flex:1,padding:"10px 4px",border:"1px solid "+(active?t.acc:t.cardBor),
                    borderRadius:10,background:active?t.accDim:t.card,cursor:"pointer",textAlign:"center"}}>
                  <div style={{fontSize:22,marginBottom:4}}>{opt[0]}</div>
                  <div style={{fontSize:11,color:active?t.acc:t.sub,fontWeight:active?700:400}}>{opt[1]}</div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );

    <div className={prefs.reducedMotion?"reduce-motion":""} style={{background:t.app,minHeight:"100vh",display:"flex",flexDirection:"column",color:t.txt,transition:"background 0.25s",zoom:prefs.largeText?1.08:1,filter:prefs.highContrast?"contrast(1.16)":"none"}}>
      {header}
      {pageContent}
      {DrinkPicker()}
      {/* NAV BAR */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:t.nav,
        borderTop:"1px solid "+t.navBor,display:"flex",zIndex:20,
        paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {NAV.map(function(item){
          var active = tab===item.id;
          return(
            <button key={item.id} onClick={function(){
              setTab(item.id);
              if (item.id!=="drinks") setSelDrink(null);
            }}
              style={{flex:1,padding:"8px 0 10px",background:"none",border:"none",cursor:"pointer",
                display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontSize:18,lineHeight:1}}>{item.emoji}</span>
              <span style={{fontSize:9,fontWeight:active?700:400,color:active?t.navAct:t.navTxt,letterSpacing:"0.3px"}}>
                {item.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
