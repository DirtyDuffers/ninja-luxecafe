// localStorage helpers
function lsGet(k, fb) {
  try { return JSON.parse(localStorage.getItem("nlc_"+k)) || fb; } catch(e){ return fb; }
}
function lsSet(k, v) {
  try { localStorage.setItem("nlc_"+k, JSON.stringify(v)); } catch(e){}
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

  var s3=useState("all");     var selCat=s3[0]; var setSelCat=s3[1];
  var s4=useState(null);      var selDrink=s4[0]; var setSelDrink=s4[1];
  var s5=useState("");        var searchQ=s5[0]; var setSearchQ=s5[1];
  var s6=useState({});        var ratings=s6[0]; var setRatings=s6[1];
  var s7=useState({});        var notes=s7[0]; var setNotes=s7[1];
  var s8=useState("");        var noteDraft=s8[0]; var setNoteDraft=s8[1];
  var s9=useState(false);     var noteEdit=s9[0]; var setNoteEdit=s9[1];
  var s10=useState({});       var expandedSecs=s10[0]; var setExpandedSecs=s10[1];
  var s11=useState([]);       var favs=s11[0]; var setFavs=s11[1];
  var s12=useState(false);    var filtersOpen=s12[0]; var setFiltersOpen=s12[1];
  var s13=useState({temp:"all",intensity:"all",sweetness:"all",texture:"all",brew:"all",favs:false}); var filters=s13[0]; var setFilters=s13[1];

  var isDark = themeMode === "dark";
  var t = isDark ? DARK : LIGHT;

  useEffect(function(){
    setRatings(lsGet("ratings", {}));
    setNotes(lsGet("notes", {}));
    setFavs(lsGet("favs", []));
  }, []);

  useEffect(function(){
    lsSet("theme", themeMode);
  }, [themeMode]);

  function openDrink(drink) {
    setSelDrink(drink);
    setExpandedSecs({});
    var saved = lsGet("note_"+drink.id, "");
    setNoteDraft(saved);
    setNoteEdit(false);
  }

  function toggleSec(sid) {
    setExpandedSecs(function(s){
      var n = Object.assign({}, s);
      n[sid] = !s[sid];
      return n;
    });
  }

  function saveRating(id, r) {
    var next = Object.assign({}, ratings);
    if (next[id] === r) { delete next[id]; } else { next[id] = r; }
    setRatings(next);
    lsSet("ratings", next);
  }

  function saveNote() {
    var next = Object.assign({}, notes);
    next[selDrink.id] = noteDraft;
    setNotes(next);
    lsSet("note_"+selDrink.id, noteDraft);
    lsSet("notes", next);
    setNoteEdit(false);
  }

  function toggleFav(id) {
    var next = favs.indexOf(id) >= 0 ? favs.filter(function(f){return f!==id;}) : favs.concat([id]);
    setFavs(next);
    lsSet("favs", next);
  }

  // Filtered drinks list
  function setFilter(key, value) {
    setFilters(function(f){ var n=Object.assign({},f); n[key]=value; return n; });
  }
  function clearFilters(){ setFilters({temp:"all",intensity:"all",sweetness:"all",texture:"all",brew:"all",favs:false}); }
  var activeFilterCount = [filters.temp,filters.intensity,filters.sweetness,filters.texture,filters.brew].filter(function(v){return v!=="all";}).length + (filters.favs?1:0);
  var filteredDrinks = DRINKS.filter(function(d){
    var matchCat = selCat === "all" || d.cat === selCat;
    var haystack = [d.name,d.desc,d.sourceType,d.coffeeIntensity,d.sweetness,d.texture,d.brewMode,d.brewStyle,d.milkType].concat(d.tags||[]).join(" ").toLowerCase();
    var matchQ = !searchQ || haystack.indexOf(searchQ.toLowerCase()) >= 0;
    var tags=(d.tags||[]).map(function(x){return String(x).toLowerCase();});
    var tempText=(d.cat+" "+tags.join(" ")+" "+(d.brewStyle||"")).toLowerCase();
    var matchTemp = filters.temp==="all" || (filters.temp==="iced" ? (tempText.indexOf("iced")>=0||tempText.indexOf("cold")>=0) : (tempText.indexOf("iced")<0&&tempText.indexOf("cold")<0));

    var matchSweet = filters.sweetness==="all" || String(d.sweetness||"").toLowerCase()===filters.sweetness;
    var matchTexture = filters.texture==="all" || String(d.texture||"").toLowerCase().indexOf(filters.texture)>=0;
    var matchBrew = filters.brew==="all" || String(d.brewMode||"").toLowerCase().indexOf(filters.brew)>=0 || String(d.brewStyle||"").toLowerCase().indexOf(filters.brew)>=0;
    var matchFav = !filters.favs || favs.indexOf(d.id)>=0;

        </div>
        {filtersOpen&&<div style={{background:t.card,border:"1px solid "+t.cardBor,borderRadius:12,padding:12,marginBottom:14}}>

            ["texture","Texture",[["all","Any"],["black","Black"],["milky","Milky"],["creamy","Creamy"],["foamy","Foamy"]]],
            ["brew","Brew type",[["all","Any"],["espresso","Espresso"],["coffee","Coffee / Filter"],["cold","Cold Pressed / Brew"]]]
          ].map(function(group){return <div key={group[0]} style={{marginBottom:10}}>

          var active = tab===item.id;
          return(
            <button key={item.id} onClick={function(){
              setTab(item.id);
              if (item.id!=="drinks") setSelDrink(null);
            }}
              style={{flex:1,padding:"8px 0 10px",background:"none",border:"none",cursor:"pointer",
                display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontSize:18,lineHeight:1}}>{item.emoji}</span>
              <span style={{fontSize:9,fontWeight:active?700:400,color:active?t.navAct:t.navTxt,letterSpacing:"0.3px"}}>
                {item.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
